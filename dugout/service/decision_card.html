<!doctype html>
<!-- The decision card as an MCP App (ui://the-dugout/decision-card.html), rendered by hosts that
     support MCP Apps when explain_decision runs. Self-contained: the host's sandbox allows no
     outside requests, so the strings below repeat web/lib/i18n.ts (keep them in step).
     Protocol: specification/2026-01-26/apps.mdx in modelcontextprotocol/ext-apps. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Dugout decision card</title>
<style>
  :root {
    --bg: var(--color-background-primary, #f5f7f6);
    --ink: var(--color-text-primary, #15211b);
    --muted: var(--color-text-secondary, #5b6962);
    --rule: var(--color-border-primary, #c9d2cd);
    --pick: #2d8656;
    --bar: #1d5ba6;
    --board: #121614;
    --amber: #ffb627;
    color-scheme: light dark;
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #1a221e);
    --ink: var(--color-text-primary, #e4ebe7);
    --muted: var(--color-text-secondary, #93a39b);
    --rule: var(--color-border-primary, #2e3a34);
    --pick: #45b277;
    --bar: #5b97e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.4 var(--font-sans, system-ui, sans-serif);
  }
  .card { padding: 14px 16px; }
  .board {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--board); color: var(--amber);
    padding: 6px 10px; border-radius: 6px;
    font: 700 13px/1.2 ui-monospace, monospace; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .board .strength { margin-left: auto; color: #fff; }
  h1 { font-size: 17px; margin: 12px 0 4px; }
  .reason { margin: 0 0 12px; color: var(--muted); }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 6px; }
  li.pick { border-color: var(--pick); }
  .label small { display: block; color: var(--pick); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .meter { width: 90px; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
  .meter span { display: block; height: 100%; background: var(--bar); }
  .nums { text-align: right; font-variant-numeric: tabular-nums; min-width: 92px; }
  .nums b { display: block; }
  .nums em { font-style: normal; color: var(--muted); font-size: 12px; }
  .nums .ci { display: block; color: var(--muted); font-size: 11px; }
  footer { margin-top: 12px; color: var(--muted); font-size: 12px; }
  .waiting { color: var(--muted); }
</style>
</head>
<body>
<main class="card" id="card"><p class="waiting">Waiting for the decision...</p></main>
<script>
(() => {
  const TEXT = {
    en: { pick: "Model's pick", pts: "pts", reference: "reference", ci90: "90% interval", failed: "This decision could not be shown.",
          strength: { strong: "Strong", lean: "Lean", toss_up: "Toss-up" },
          trigger: { condition_drop: "Fading against his team", goal_after_55: "Goal after 55'", manager_sub: "Manager's substitution", on_request: "On request" },
          option: { no_change: "No change", sub_like_for_like: "Like-for-like sub for {name}", attacking: "Attacking change", defensive: "Defensive change" },
          foot: (foundry) => `Numbers from the decision engine on a synthetic match. Text ${foundry ? "written by a Microsoft Foundry model and" : "from the templates,"} checked in code.`,
          engineOnly: "Numbers from the decision engine on a synthetic match, asked at this minute; no narration." },
    es: { pick: "Elección del modelo", pts: "pts", reference: "referencia", ci90: "Intervalo del 90%", failed: "No se pudo mostrar esta decisión.",
          strength: { strong: "Fuerte", lean: "Leve", toss_up: "Igualado" },
          trigger: { condition_drop: "Se apaga frente a su equipo", goal_after_55: "Gol después del 55'", manager_sub: "Cambio del entrenador", on_request: "A petición" },
          option: { no_change: "Sin cambios", sub_like_for_like: "Cambio por {name}, mismo puesto", attacking: "Cambio ofensivo", defensive: "Cambio defensivo" },
          foot: (foundry) => `Números del motor de decisiones en un partido sintético. Texto ${foundry ? "escrito por un modelo de Microsoft Foundry y" : "de las plantillas,"} verificado en código.`,
          engineOnly: "Números del motor de decisiones en un partido sintético, pedidos para este minuto; sin narración." },
  };
  const PLAYER_ID = /\b[A-Z]{2,4}-\d{2}\b/g;
  let lang = "en";
  let nextId = 1;
  const pending = new Map();
  const post = (msg) => window.parent.postMessage({ jsonrpc: "2.0", ...msg }, "*");
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = `card-${nextId++}`; // a string, so it never collides with the host's own numeric ids
    pending.set(id, { resolve, reject });
    post({ id, method, params });
  });

  const el = (tag, attrs = {}, ...kids) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    for (const kid of kids) node.append(kid);
    return node;
  };

  // As web/lib/i18n.ts: whole-number percentages to one decimal, points with a true minus sign.
  const decimal = (x, digits) => { const s = x.toFixed(digits); return lang === "en" ? s : s.replace(".", ","); };
  const pct = (x) => `${decimal(x * 100, 1)}%`;
  const points = (x) => { const n = Math.round(x * 1000) / 10; return `${n > 0 ? "+" : n < 0 ? "−" : ""}${decimal(Math.abs(n), 1)}`; };

  function render(card) {
    const p = card.payload;
    lang = TEXT[card.locale] ? card.locale : "en";
    const t = TEXT[lang];
    const names = card.names ?? {};
    const withNames = (text) => text.replace(PLAYER_ID, (id) => names[id] ?? id);
    document.documentElement.lang = lang;
    // a toss-up says the options are close instead of recommending one (as the web card)
    const best = p.recommendation.strength === "toss_up" ? null : p.recommendation.option_id;
    const tiring = p.evidence.find((e) => e.type === "condition")?.player_id;
    const label = (o) => {
      const name = t.option[o.id];
      if (!name || (name.includes("{name}") && !tiring)) return withNames(o.label);
      return name.replace("{name}", names[tiring] ?? tiring);
    };
    document.getElementById("card").replaceChildren(
      el("div", { class: "board" },
        el("span", {}, card.clock ?? `${Math.floor(p.t_ms / 60000)}'`), el("span", {}, p.team),
        el("span", {}, t.trigger[p.trigger] ?? p.trigger.replaceAll("_", " ")),
        el("span", { class: "strength" }, t.strength[p.recommendation.strength] ?? p.recommendation.strength)),
      ...(card.headline ? [el("h1", {}, withNames(card.headline)), el("p", { class: "reason" }, withNames(card.reason))] : []),
      el("ol", {}, ...p.options.map((o) => {
        const pick = o.id === best;
        const name = el("span", { class: "label" }, label(o));
        if (pick) name.append(el("small", {}, t.pick));
        const meter = el("span", { class: "meter", role: "img", "aria-label": pct(o.win) }, el("span", { style: `width:${Math.round(o.win * 100)}%` }));
        const nums = el("span", { class: "nums" }, el("b", {}, pct(o.win)),
          el("em", {}, o.id === "no_change" ? t.reference : `${points(o.delta_win)} ${t.pts}`));
        if (card.mode === "analyst" && o.ci90) nums.append(el("span", { class: "ci" }, `${t.ci90} ${points(o.ci90[0])} / ${points(o.ci90[1])}`));
        return el("li", { class: pick ? "pick" : "" }, name, meter, nums);
      })),
      el("footer", {}, card.headline ? t.foot(card.narrated_by === "foundry" && card.source === "model") : t.engineOnly),
    );
  }

  function failed() {
    document.getElementById("card").replaceChildren(el("p", { class: "waiting" }, TEXT[lang].failed));
  }

  function applyContext(ctx) {
    if (!ctx) return;
    if (ctx.theme) document.documentElement.dataset.theme = ctx.theme;
    for (const [name, value] of Object.entries(ctx.styles?.variables ?? {})) {
      document.documentElement.style.setProperty(name, value);
    }
  }

  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.method === undefined) { // a response to one of our requests
      const waiting = pending.get(msg.id);
      if (!waiting) return;
      pending.delete(msg.id);
      msg.error ? waiting.reject(new Error(msg.error.message ?? "error")) : waiting.resolve(msg.result);
      return;
    }
    if (msg.id !== undefined) { // a request from the host: answer it, so it never waits on us
      const known = msg.method === "ping" || msg.method === "ui/resource-teardown";
      post(known ? { id: msg.id, result: {} } : { id: msg.id, error: { code: -32601, message: "Method not found" } });
      return;
    }
    if (msg.method === "ui/notifications/tool-result") {
      const content = msg.params?.structuredContent;
      const data = content?.payload || content?.options ? content : content?.result; // a dict, or wrapped as {"result": ...}
      if (msg.params?.isError || !(data?.payload || data?.options)) failed();
      // explain_decision sends a narrated card; price_options a bare engine payload, shown as an analyst would see it
      else render(data.payload ? data : { payload: data, names: data.names, clock: data.clock, locale: "en", mode: "analyst" });
    } else if (msg.method === "ui/notifications/tool-cancelled") {
      failed();
    } else if (msg.method === "ui/notifications/host-context-changed") {
      applyContext(msg.params);
    }
  });

  // The card's own height: the document's would never be smaller than the frame the host opened.
  new ResizeObserver(() => {
    const box = document.body.getBoundingClientRect();
    post({ method: "ui/notifications/size-changed", params: { width: Math.ceil(box.width), height: Math.ceil(box.height) } });
  }).observe(document.body);

  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appCapabilities: { availableDisplayModes: ["inline"] },
    clientInfo: { name: "the-dugout-decision-card", version: "1.0.0" },
  }).then((result) => {
    applyContext(result?.hostContext);
    post({ method: "ui/notifications/initialized", params: {} });
  }).catch(() => {});
})();
</script>
</body>
</html>
