[project]
name = "dugout"
version = "0.1.0"
description = "Explains a football manager's decisions as they happen, on synthetic match data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core>=1.22.0",
    "azure-eventhub>=5.15.1",
    "azure-messaging-webpubsubservice>=1.3.0",
    "fastapi>=0.148.0",
    "httpx>=0.28.1",
    "numpy>=2.2",
    "pyyaml>=6.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dugout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
